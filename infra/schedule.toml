# pigtail schedule (M1-T21; batch runs since M11, ADR-048, ADR-049.1). Read by
# `pigtail scheduler run|plan`; override the path with PIGTAIL_SCHEDULE. Durations: 90s, 5m, 2h,
# 1d. Intervals under 1 minute are refused (TM-04).
#
# `pigtail scheduler run --once` is one batch run: it runs every job that is due plus the
# start-of-run jobs, then exits (M14 adds the launchd schedule that calls it). The long-running
# loop (`pigtail scheduler run` without --once) is optional: the server path, or while a launch is
# followed. Each job runs `pigtail <command>` in a child process, holds a Postgres advisory lock
# while it runs (no overlap), retries failures with exponential backoff (retry_base x 2^n, capped
# at `every`, for `max_retries` failures in a row), and writes a `runs` record `scheduler.<job>`.
#
# The global-collection jobs (GH Archive velocity scan and backfill, watch-list counts, search
# sweeps, HN/GH Archive screens, detection v1, settle-lag) were removed in M11 (ADR-047.6,
# ADR-049.5); see the git tag `archive/global-collection`.

[scheduler]
tick = "15s"          # how often the loop looks for due jobs
alert_every = "5m"    # how often alert rules are evaluated

[alerts]
stale_factor = 3          # job_stale: no success for 3x the job's interval
consecutive_failures = 3  # job_failing
disk_percent = 80         # disk_high: PIGTAIL_DATA_DIR volume usage
repeat = "6h"             # re-notify a still-firing alert at most this often
login_failures = 10       # CB-30: failed UI logins (rate-limited attempts included) ...
login_window = "1h"       # ... within this window raise `login_failures`
integrity_window = "24h"  # CB-30: any snapshot hash mismatch in the UI raises `snapshot_integrity`
file_max_bytes = 1000000  # CB-31: rotate ALERTS.md / alerts.jsonl at this size or when their first
file_rotate_after = "30d" # event is this old; archives are deleted after LOG_RETENTION_DAYS (<= 365)

# HN front-page ranks: project-level only, on by default (ADR-031.1, ADR-049.1). No always-on
# poller: one snapshot of the current front page at the start of every scheduled run
# (`run_at_start`), and every `every` only while a brief or tracked project is in launch mode
# (`launch_mode_only`; launch_mode_window, or PIGTAIL_LAUNCH_MODE=1). Rank history outside those
# windows is not collected and is reported as a coverage gap; historical front-page presence comes
# from the Algolia `front_page` tag, labelled as such. For manual continuous polling use
# `pigtail capture hn-ranks --loop`.
[jobs.hn_ranks]
command = ["capture", "hn-ranks", "--once"]
every = "5m"
timeout = "4m"
retry_base = "1m"
requires = ["hn_ranks"]
run_at_start = true
launch_mode_only = true

# Retention purge (CB-01, CB-04, CB-05, CB-18; CB-33: UI audit rows past LOG_RETENTION_DAYS).
[jobs.retention_purge]
command = ["retention", "purge"]
every = "1d"
timeout = "2h"
retry_base = "10m"

# Deletion sync (CB-02, R1.5). Runs even while HN collection is off (checks store nothing).
[jobs.deletion_sync]
command = ["privacy", "deletion-sync"]
every = "1d"
timeout = "2h"
retry_base = "10m"

# HN mentions for live cases opened within `window` (R1.2). Person-level: skipped (and logged)
# unless PIGTAIL_ENABLE_HN=1 and PIGTAIL_ADR022_PERSON_SOURCES_OK=1 (ADR-022, ADR-031.2).
[jobs.hn_mentions]
kind = "hn_mentions"
every = "3h"
timeout = "1h"
window = "48h"
since_before_open = "14d"
retry_base = "10m"

# --- Per-repo GitHub collectors (M1-T24, ADR-032; per-repo only since M11). Every job below
# requires the `github` connector, which makes no live call without GITHUB_TOKEN: until the
# operator sets it, each run is skipped and logged with reason `missing_env:GITHUB_TOKEN` (no
# failure, no alert). Budgets: see docs/guides/operator.md "GitHub token and budgets".

# Star-history daily series for the repos of open cases (never fetched, or older than 20 h).
[jobs.gh_star_history]
command = ["capture", "github", "star-history", "--cases"]
every = "1d"
timeout = "50m"
retry_base = "10m"
requires = ["github"]

# Per-repo events for open cases (TM-33): PERSON-LEVEL, off by default. Needs `enabled = true`
# here, PIGTAIL_ENABLE_GITHUB_EVENTS=1 and PIGTAIL_ADR022_PERSON_SOURCES_OK=1 (ADR-022, ADR-036);
# otherwise skipped with reason connector_disabled / person_source_hold. Each repo is polled at
# most every 15 min and never faster than GitHub's X-Poll-Interval.
[jobs.gh_repo_events]
command = ["capture", "github", "repo-events"]
every = "15m"
timeout = "14m"
retry_base = "5m"
enabled = false
requires = ["github", "github_events"]

# --- Backups (CB-17, CB-17b; ADR-044). OFF by default. They need `pg_dump` 16 and `age` (or gpg)
# ON THE HOST running the scheduler: the app image has neither, so under Docker Compose keep these
# off and run `pigtail backup create` from a host cron/systemd timer instead. Both use
# BACKUP_DIR (outside any git tree); create also needs BACKUP_RECIPIENT. A missing tool, variable
# or directory makes the run fail (job_failing alert); `pigtail doctor` also reports the age of
# the newest backup (warn > 2 days, fail > 7 days).
[jobs.backup_create]
command = ["backup", "create"]
every = "1d"
timeout = "2h"
retry_base = "30m"
enabled = false

[jobs.backup_prune]
command = ["backup", "prune"]
every = "1d"
timeout = "10m"
retry_base = "30m"
enabled = false

# pigtail unattended schedule (M1-T21). Read by `pigtail scheduler run`; override the path with
# PIGTAIL_SCHEDULE. Durations: 90s, 5m, 2h, 1d. Intervals under 1 minute are refused (TM-04).
# Each job runs `pigtail <command>` in a child process, holds a Postgres advisory lock while it
# runs (no overlap), retries failures with exponential backoff (retry_base x 2^n, capped at
# `every`, for `max_retries` failures in a row), and writes a `runs` record `scheduler.<job>`.

[scheduler]
tick = "15s"          # how often the loop looks for due jobs
alert_every = "5m"    # how often alert rules are evaluated

[alerts]
stale_factor = 3          # job_stale: no success for 3x the job's interval
consecutive_failures = 3  # job_failing
disk_percent = 80         # disk_high: PIGTAIL_DATA_DIR volume usage
repeat = "6h"             # re-notify a still-firing alert at most this often

# HN front-page ranks: project-level only, on by default (ADR-031.1). Rank history cannot be
# backfilled, so this is the job that must never stop.
[jobs.hn_ranks]
command = ["capture", "hn-ranks", "--once"]
every = "5m"
timeout = "4m"
retry_base = "1m"
requires = ["hn_ranks"]

# GH Archive velocity scan (R1.1). Limited value for breakout detection (ADR-028) but cheap.
# Scans [midnight UTC `catchup_days` before, now - lag); complete days already scanned are skipped.
[jobs.gharchive_scan]
kind = "gharchive_scan"
every = "1h"
timeout = "50m"
lag = "2h"
catchup_days = 2
retry_base = "5m"

# Retry missing GH Archive hours (M1-T19): 404/5xx/transport errors and undecodable dumps are
# marked missing at scan time with a backoff (1h, 2h, 4h, ... capped at 24h). This job retries the
# ones that are due, up to `--days` back, and re-aggregates the days that came back. Cheap when
# nothing is due (one query).
[jobs.gharchive_backfill]
command = ["capture", "backfill-gharchive", "--days", "7"]
every = "1h"
timeout = "50m"
retry_base = "10m"
requires = ["gharchive"]

# Retention purge (CB-01, CB-04, CB-05, CB-18; CB-33: UI audit rows past LOG_RETENTION_DAYS).
[jobs.retention_purge]
command = ["retention", "purge"]
every = "1d"
timeout = "2h"
retry_base = "10m"

# Deletion sync (CB-02, R1.5). Runs even while HN collection is off (checks store nothing).
[jobs.deletion_sync]
command = ["privacy", "deletion-sync"]
every = "1d"
timeout = "2h"
retry_base = "10m"

# Raw GH Archive dump purge (CB-04). Retention purge covers this too; kept as a separate, cheap job.
[jobs.purge_raw]
command = ["capture", "purge-raw"]
every = "1d"
timeout = "1h"
retry_base = "10m"

# HN mentions for live cases opened within `window` (R1.2). Person-level: skipped (and logged)
# unless PIGTAIL_ENABLE_HN=1 and PIGTAIL_ADR022_PERSON_SOURCES_OK=1 (ADR-022, ADR-031.2).
[jobs.hn_mentions]
kind = "hn_mentions"
every = "3h"
timeout = "1h"
window = "48h"
since_before_open = "14d"
retry_base = "10m"

# --- GitHub detection (M1-T24, ADR-032). Every job below requires the `github` connector, which
# makes no live call without GITHUB_TOKEN: until the operator sets it, each run is skipped and
# logged with reason `missing_env:GITHUB_TOKEN` (no failure, no alert). Budgets: see
# docs/guides/operator.md "GitHub token and budgets".

# Hourly GraphQL star/fork counts for the watch list (100 repos per query, ~1 point each).
[jobs.gh_watchlist_counts]
command = ["capture", "github", "watchlist-counts"]
every = "1h"
timeout = "45m"
retry_base = "5m"
requires = ["github"]

# Search sweeps (new repos, recently pushed repos in star bands) into the watch list.
[jobs.gh_search_sweep]
command = ["capture", "github", "search-sweep", "--kind", "all"]
every = "6h"
timeout = "2h"
retry_base = "15m"
requires = ["github"]

# GitHub URLs from the HN rank poller + Show HN (project-level), and GH Archive nominations.
[jobs.gh_hn_screen]
command = ["capture", "github", "hn-screen"]
every = "1h"
timeout = "30m"
retry_base = "5m"
requires = ["github", "hn_ranks"]

# Star-history baselines: new watch-list entries, pre-threshold repos and cases (daily refresh).
[jobs.gh_star_history_confirm]
command = ["capture", "github", "star-history", "--candidates"]
every = "1h"
timeout = "50m"
retry_base = "10m"
requires = ["github"]

# Detection v1 (counts screen + star-history confirmation). GH Archive `gharchive_scan` stays on
# as the velocity-v0 control; agreement is recorded.
[jobs.gh_detect_v1]
command = ["capture", "github", "detect-v1"]
every = "1h"
timeout = "30m"
retry_base = "5m"
requires = ["github"]

# settle_lag collection for the threshold calibration (K2, M4-T4): each day, yesterday's
# star-history day of up to 100 calibration-split case repos is enrolled for re-fetches at
# +1, +3, +7, +14 and +21 days; every fetch version is kept (star_history_settle_obs). About one
# core request per enrolled repo per day. Skipped (missing_env:GITHUB_TOKEN) until the token is set.
[jobs.gh_settle_lag]
command = ["capture", "github", "settle-lag"]
every = "1h"
timeout = "30m"
retry_base = "10m"
requires = ["github"]

# Per-repo events for open cases (TM-33): PERSON-LEVEL, off by default. Needs `enabled = true`
# here, PIGTAIL_ENABLE_GITHUB_EVENTS=1 and PIGTAIL_ADR022_PERSON_SOURCES_OK=1 (ADR-022, ADR-036);
# otherwise skipped with reason connector_disabled / person_source_hold. Each repo is polled at
# most every 15 min and never faster than GitHub's X-Poll-Interval.
[jobs.gh_repo_events]
command = ["capture", "github", "repo-events"]
every = "15m"
timeout = "14m"
retry_base = "5m"
enabled = false
requires = ["github", "github_events"]

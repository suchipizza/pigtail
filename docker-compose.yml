# pigtail stack (PRD §10 self-hosting): Postgres + S3-compatible object storage, the private UI,
# and an optional long-running `scheduler` (profile `server`, ADR-048.6). Runs are batch runs
# (`pigtail scheduler run --once`, ADR-048, ADR-049.1): nothing collects between runs by default.
name: pigtail

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pigtail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pigtail}
      POSTGRES_DB: ${POSTGRES_DB:-pigtail}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pigtail}"]
      interval: 5s
      timeout: 3s
      retries: 20

  objectstore:
    # Local S3-compatible store for snapshots (SeaweedFS; see ADR-005). Production can point
    # S3_ENDPOINT at any private S3-compatible bucket instead.
    image: chrislusf/seaweedfs:4.47
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pigtail-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pigtail-local-secret}
      # DPIA CB-03: SSE-S3 key-encryption key (64 hex chars, `openssl rand -hex 32`). Empty =
      # SSE disabled. Keep it in the host environment, never in git or in the data volume.
      WEED_S3_SSE_KEK: ${S3_SSE_KEK:-}
    entrypoint: >
      /bin/sh -c "sed -e s/__S3_ACCESS_KEY__/$$S3_ACCESS_KEY/ -e s/__S3_SECRET_KEY__/$$S3_SECRET_KEY/
      /etc/pigtail/s3.json.tmpl > /tmp/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -volume.max=0"
    ports: ["127.0.0.1:9000:9000"]
    volumes:
      - snapshots:/data
      - ./infra/seaweedfs/s3.json.tmpl:/etc/pigtail/s3.json.tmpl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  objectstore-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      objectstore: {condition: service_healthy}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-pigtail-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-pigtail-local-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-pigtail-snapshots}
      S3_SSE: ${S3_SSE_KEK:+on}  # only a flag; the key itself stays with the object store
    entrypoint: >
      /bin/sh -c "(aws --endpoint-url http://objectstore:9000 s3api head-bucket --bucket $$S3_BUCKET 2>/dev/null ||
      aws --endpoint-url http://objectstore:9000 s3 mb s3://$$S3_BUCKET) &&
      if [ -n \"$$S3_SSE\" ]; then aws --endpoint-url http://objectstore:9000 s3api put-bucket-encryption
      --bucket $$S3_BUCKET --server-side-encryption-configuration
      '{\"Rules\":[{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"AES256\"}}]}'; fi &&
      echo ready > /tmp/probe && i=0 &&
      until aws --endpoint-url http://objectstore:9000 s3 cp /tmp/probe s3://$$S3_BUCKET/.pigtail-probe >/dev/null 2>&1;
      do i=$$((i+1)); [ $$i -ge 60 ] && echo 'object store not writable after 60 tries' && exit 1; sleep 2; done &&
      aws --endpoint-url http://objectstore:9000 s3 rm s3://$$S3_BUCKET/.pigtail-probe >/dev/null &&
      echo 'object store writable'"

  scheduler:
    # Optional long-running scheduler loop (M1-T21) for the server path only (ADR-048.6):
    # `docker compose --profile server up -d scheduler`. Not started by a plain `docker compose
    # up` (ADR-049.1: no always-on process by default); batch runs use
    # `docker compose run --rm scheduler pigtail scheduler run --once`.
    # Same image as other app services (Dockerfile at the repo root). docs/guides/operator.md
    # "Scheduled runs".
    profiles: ["server"]
    build:
      context: .
      args:
        PIGTAIL_CODE_COMMIT: ${PIGTAIL_CODE_COMMIT:-}
    image: pigtail-app:local
    command: ["pigtail", "scheduler", "run"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network; override with COMPOSE_DATABASE_URL / COMPOSE_S3_ENDPOINT
      # to use external services.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-pigtail}:${POSTGRES_PASSWORD:-pigtail}@db:5432/${POSTGRES_DB:-pigtail}}
      S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://objectstore:9000}
      PIGTAIL_DATA_DIR: /data
      PIGTAIL_HEALTH_BIND: 0.0.0.0
      PIGTAIL_HEALTH_PORT: "8787"
    depends_on:
      db: {condition: service_healthy}
    volumes: [app-data:/data]
    ports: ["127.0.0.1:8787:8787"]  # /healthz on the host's loopback only
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ui:
    # Private web app (M1-T12, D1 preview): read-only API + built UI in one process, behind
    # operator login (R13.3). Needs PIGTAIL_OPERATOR_PASSWORD_HASH (`pigtail ui hash-password`);
    # in .env, single-quote it so `$` is not interpolated. docs/guides/operator.md "Web app".
    build:
      context: .
      dockerfile: infra/ui/Dockerfile
      args:
        PIGTAIL_CODE_COMMIT: ${PIGTAIL_CODE_COMMIT:-}
    image: pigtail-ui:local
    init: true
    # CB-29 (ADR-043): no `env_file`. The UI gets only the variables below, taken from the host
    # environment or `.env` by compose interpolation, so it never receives OPTOUT_KEY /
    # PSEUDONYM_KEY (it matches no opt-outs), GITHUB_TOKEN, SMTP_URL, API keys or other secrets it does not use.
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-pigtail}:${POSTGRES_PASSWORD:-pigtail}@db:5432/${POSTGRES_DB:-pigtail}}
      S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://objectstore:9000}
      PIGTAIL_DATA_DIR: /data
      # brief store (R18.9, ADR-071.3): the host briefs directory, bind-mounted read-write below
      # so the brief editor can save new versions. Never inside the repo. The container runs as
      # UID 10001: on Linux that UID must own the host directory (docs/guides/operator.md
      # "Web app", "Briefs in the container").
      PIGTAIL_BRIEFS_DIR: /briefs
      # snapshot store (read-only use: snapshot viewer)
      SNAPSHOT_BACKEND: ${SNAPSHOT_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-pigtail-snapshots}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pigtail-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pigtail-local-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      # operator login (R13.3); single-quote the hash in .env so `$` is not interpolated
      PIGTAIL_OPERATOR_PASSWORD_HASH: ${PIGTAIL_OPERATOR_PASSWORD_HASH:-}
      PIGTAIL_UI_SECURE_COOKIE: ${PIGTAIL_UI_SECURE_COOKIE:-}
      PIGTAIL_UI_SESSION_HOURS: ${PIGTAIL_UI_SESSION_HOURS:-}
      PIGTAIL_UI_IDLE_MINUTES: ${PIGTAIL_UI_IDLE_MINUTES:-}
      # retention periods shown in the evidence view; audit-log retention (CB-18, CB-33)
      PERSON_LEVEL_RETENTION_DAYS: ${PERSON_LEVEL_RETENTION_DAYS:-}
      SNAPSHOT_AFTER_REPORT_DAYS: ${SNAPSHOT_AFTER_REPORT_DAYS:-}
      GHARCHIVE_RAW_RETENTION_DAYS: ${GHARCHIVE_RAW_RETENTION_DAYS:-}
      LLM_CACHE_RETENTION_DAYS: ${LLM_CACHE_RETENTION_DAYS:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-}
      GITHUB_EVENTS_RETENTION_DAYS: ${GITHUB_EVENTS_RETENTION_DAYS:-}
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - app-data:/data:ro  # local snapshots are only read
      - ${PIGTAIL_BRIEFS_DIR:-~/.pigtail/briefs}:/briefs:rw  # host briefs dir (outside git)
    ports: ["127.0.0.1:8080:8080"]  # host loopback only; put TLS in front for remote access
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data:
  snapshots:
  app-data:  # PIGTAIL_DATA_DIR of the app services: local snapshots, LLM cache, alerts/

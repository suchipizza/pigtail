name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy
      - name: Bundle schema matches models
        run: uv run python -m pigtail.bundle.schema --check
      - name: Tests (unit, contract, integration, golden)
        run: uv run pytest -q
      - name: Example commands smoke test
        run: |
          uv run pigtail version
          for b in examples/reviewed/*/research-bundle.json; do
            [ -f "$b" ] || continue
            uv run pigtail validate "$b" --published
            uv run pigtail render "$b" --output "$(mktemp -d)"
          done
      - name: Secret scan
        run: python scripts/secret_scan.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Site build (from reviewed examples, no database)
        run: pnpm build
        working-directory: site

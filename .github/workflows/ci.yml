name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  private-data-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Private-data scan (snapshots, raw records, handles, secrets)
        run: python3 scripts/private_data_scan.py
      - name: Secret scan (gitleaks, pushed commit range)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pigtail
          POSTGRES_PASSWORD: pigtail
          POSTGRES_DB: pigtail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pigtail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pigtail:pigtail@localhost:5432/pigtail
      # db- and s3-marked tests must run (not skip) in CI (M1-T20: S3 service below).
      PIGTAIL_REQUIRE_DB: "1"
      PIGTAIL_REQUIRE_S3: "1"
      S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - name: Object store for s3-marked tests (SeaweedFS + bucket, exactly as docker-compose.yml)
        # A `services:` container cannot take SeaweedFS's command line, so the compose service
        # itself is started (published on 127.0.0.1:9000, default local credentials).
        run: |
          docker compose up -d --wait --wait-timeout 180 objectstore
          docker compose run --rm objectstore-init
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests
        # Smoke tests against real backends skip here: no Claude login and no API key in CI.
        run: uv run pytest -q --cov=pigtail --cov-report=term-missing
      - name: Stop the object store
        if: always()
        run: docker compose down -v

  ui:
    # M1-T12: the private web app (ui/, TypeScript strict + React + Vite).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version from ui/package.json "packageManager"
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types (tsc strict)
        run: pnpm typecheck
      - name: Tests (vitest)
        run: pnpm test
      - name: Build
        run: pnpm build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose config -q
      - name: docker compose up (db + object storage healthy)
        run: |
          docker compose up -d --wait db objectstore
          docker compose run --rm objectstore-init
          docker compose down -v
      - name: scheduler smoke (M1-T21; image builds, /healthz answers, no external fetches)
        run: |
          {
            echo "PSEUDONYM_KEY=$(openssl rand -hex 24)"
            echo "PIGTAIL_CONNECTOR_HN_RANKS_ENABLED=false"
            echo "PIGTAIL_CONNECTOR_GHARCHIVE_ENABLED=false"
          } > .env
          docker compose build --build-arg PIGTAIL_CODE_COMMIT=${{ github.sha }} scheduler
          docker compose up -d --wait --wait-timeout 180 scheduler
          curl -fsS http://127.0.0.1:8787/healthz | python3 -m json.tool | head -40
          docker compose exec -T scheduler pigtail health || true
          docker compose down -v
          rm -f .env

[project]
name = "pigtail"
version = "0.1.0"
description = "Evidence-based forensics of how open-source projects grow"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.70",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "argon2-cffi>=25.1.0",
    "psycopg-pool>=3.3.3",
]

[project.scripts]
pigtail = "pigtail.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4",
    "jsonschema>=4.23",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pigtail"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: calls a real LLM backend (skipped unless PIGTAIL_RUN_SMOKE=1)",
    "db: needs Postgres at DATABASE_URL (skipped if unreachable unless PIGTAIL_REQUIRE_DB=1)",
    "s3: needs the S3 store at S3_ENDPOINT (skipped if unreachable unless PIGTAIL_REQUIRE_S3=1)",
]
